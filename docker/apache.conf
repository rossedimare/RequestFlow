# Apache site for RequestFlow on Render.
# ${PORT} is expanded from the container environment (Render sets it; the
# Dockerfile and entrypoint default it to 10000). TLS is terminated by Render's
# proxy, so only plain HTTP is served here.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # public/.htaccess holds Laravel's rewrite rules.
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>

    # The official image links these to stdout/stderr, so they show up in Render's logs.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Render Free has 512 MB of RAM and each mod_php worker uses roughly 30-40 MB,
# so keep the number of workers small. This file is read after mods-enabled, so
# these values take precedence over the stock prefork settings.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 3
    MaxRequestWorkers 8
    MaxConnectionsPerChild 500
</IfModule>
